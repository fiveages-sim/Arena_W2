services:
  arena:
    image: "${ARENA_IMAGE}"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/docker/Dockerfile
      args:
        - gid=${HOST_GID}
        - uid=${HOST_UID}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "${HOST_SCENES_DIR:-/tmp/arena_scenes}:/data/scenes"
    environment:
      - QT_X11_NO_MITSHM=1
      - TMPDIR=/tmp/shared
      - DISPLAY
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_GID
      - HOST_ARENA_WS_DIR
    env_file:
      - "$HOST_ARENA_WS_DIR/.env"
    user: "${HOST_UID}"
    group_add:
      - sudo
    network_mode: host
    command: ["bash"]
    stdin_open: true 
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/.built"]
      interval: 1s
      timeout: 2s
      retries: 99999 # if you can't build by then, good juck
      start_period: 0s
    ports:
      - 50101
      - 50102

  isaac:
    # arena_isaac with no tag is the 5.1 image. ros2 launch runs compose from
    # inside the ROS container and does not see docker-compose.fiveages.yaml,
    # so the pin and the USDA mount have to live in this file. .env sets
    # ARENA_ISAAC_IMAGE=arena_isaac:6.1. Unset it to stay on 5.1.0.
    image: ${ARENA_ISAAC_IMAGE:-arena_isaac:5.1.0}
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/isaac/Dockerfile
      args:
        ISAAC_SIM_IMAGE: ${ISAAC_SIM_IMAGE:-nvcr.io/nvidia/isaac-sim:5.1.0}
        ISAAC_PYTHON: ${ISAAC_PYTHON:-3.11}
    network_mode: host
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "${HOST_SCENES_DIR:-/tmp/arena_scenes}:/data/scenes"
      - "${HOST_DEPS_DIR:-/home/zy/SocialNav/arena_ws/src/deps}:/opt/arena_ws/src/deps"
      - "${HOST_W2_USDA_DIR:-/home/zy/FaSim-Isaac/robots/humanoid/FiveAges/Gen2/W2}:/opt/w2_usda:ro"
    environment:
      - DISPLAY
      - TMPDIR=/tmp/shared
      - QT_X11_NO_MITSHM=1
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_ARENA_WS_DIR
      - ROS_DOMAIN_ID=1
    stdin_open: true 
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  shared:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
